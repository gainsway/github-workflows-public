name: publish nuget packages to github packages

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: true
        type: string
        default: "9.0.x"
    secrets:
      NUGET_ORG_API_KEY:
        required: true

jobs:
  validate-tag:
    name: Validate Tag
    if: startsWith(github.ref, 'refs/tags')
    uses: gainsway/github-workflows-public/.github/workflows/job.validate-tag.yml@main

  publish:
    runs-on: ubuntu-latest
    needs: validate-tag
    if: |
      always() &&
      (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped')
    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}
      commitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"
          includePrerelease: true

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        id: gitversion # step id used as reference for output values
        with:
          overrideConfig: |
            tag-prefix: v

      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.SemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      - name: Package
        run: dotnet pack -p:Version='${{ steps.gitversion.outputs.fullSemVer }}' -c Release --output Publish

      - name: Push package to Nuget.org
        run: dotnet nuget push "Publish/*.nupkg" --api-key ${{ secrets.NUGET_ORG_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
