name: Test NuGet package discovery

on:
  pull_request:
    paths:
      - '.github/workflows/nuget.publish.yml'
      - '.github/workflows/test-nuget-publish.yml'
      - 'scripts/tests/test_nuget_package_discovery.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuget.publish.yml'
      - '.github/workflows/test-nuget-publish.yml'
      - 'scripts/tests/test_nuget_package_discovery.py'

permissions:
  contents: read

jobs:
  discovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts/tests -v
