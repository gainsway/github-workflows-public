name: publish nuget packages to github packages

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: true
        type: string
        default: '9.0.x'
    secrets:
      NUGET_TOKEN:
        required: true

jobs:
  validate-tag:
    name: Validate Tag
    if: startsWith(github.ref, 'refs/tags')
    uses: gainsway/github-workflows-public/.github/workflows/job.validate-tag.yml@main

  publish:
    runs-on: ubuntu-latest
    needs: validate-tag
    if: |
      always() &&
      (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped')
    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}
      commitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
      package-names: ${{ steps.packages.outputs.package-names }}
    env:
      GITHUB_OWNER: gainsway
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'
          includePrerelease: true

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v4
        id: gitversion # step id used as reference for output values
        with:
          overrideConfig: |
            tag-prefix: v

      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.SemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      - name: Configure Nuget sources
        run: dotnet nuget add source --username $GITHUB_OWNER --password ${{ secrets.NUGET_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/$GITHUB_OWNER/index.json"

      - name: Package
        run: dotnet pack -p:Version='${{ steps.gitversion.outputs.fullSemVer }}' -c Release --output Publish

      - name: Extract all package names
        id: packages
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          import zipfile

          package_names = {}
          for package_file in sorted(Path("Publish").glob("*.nupkg")):
              if package_file.name.endswith(".symbols.nupkg"):
                  continue
              with zipfile.ZipFile(package_file) as package:
                  manifests = [name for name in package.namelist() if name.endswith(".nuspec")]
                  if len(manifests) != 1:
                      raise SystemExit(f"Expected one nuspec in {package_file}")
                  manifest = ET.fromstring(package.read(manifests[0]))
                  package_name = manifest.findtext("{*}metadata/{*}id", "").strip()
              if not re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", package_name):
                  raise SystemExit(f"Invalid or missing package ID in {package_file}")
              package_names.setdefault(package_name.lower(), package_name)

          if not package_names:
              raise SystemExit("No packages found in Publish")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("package-names=" + json.dumps(sorted(package_names.values())) + "\n")
          PY

      - name: Push package to GitHub packages
        run: dotnet nuget push "Publish/*.nupkg" --api-key ${{ secrets.NUGET_TOKEN }} --source "github" --skip-duplicate

  cleanup:
    name: Clean prereleases (${{ matrix.package-name }})
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJSON(needs.publish.outputs.package-names) }}
    steps:
      - name: Clean up old pre-release package versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: gainsway
          package-name: ${{ matrix.package-name }}
          package-type: nuget
          token: ${{ secrets.NUGET_TOKEN }}
          min-versions-to-keep: 10
          delete-only-pre-release-versions: 'true'
