# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
#
# Shared reusable job. Runs the pullfrog agent action given a prompt.
# This workflow_call has no trigger of its own — it only runs when a caller
# workflow invokes it via `uses:`. The sample dispatcher below is manual
# (workflow_dispatch), but any caller event (push, pull_request, schedule,
# etc.) can call this job just as well; that's the caller's choice, not a
# constraint enforced here.
#
# Setup in a new repo:
#   1. Ensure at least one provider secret below (e.g. ANTHROPIC_API_KEY or
#      CLAUDE_CODE_OAUTH_TOKEN) is set at the repo or org level.
#   2. Add a thin dispatcher workflow in that repo, e.g.
#      .github/workflows/pullfrog.yml:
#
#        name: Pullfrog
#        run-name: ${{ inputs.name || github.workflow }}
#        on:
#          workflow_dispatch:
#            inputs:
#              prompt:
#                type: string
#                description: Agent prompt
#                required: true
#              name:
#                type: string
#                description: Run name
#        jobs:
#          pullfrog:
#            permissions:
#              id-token: write
#              contents: read
#            uses: gainsway/github-workflows-public/.github/workflows/job.pullfrog.yml@main
#            with:
#              prompt: ${{ inputs.prompt }}
#            secrets: inherit
#
#      A called reusable workflow can't elevate permissions beyond what its
#      caller job grants — id-token: write must be requested here too, or
#      Pullfrog won't actually receive OIDC credentials despite the called
#      job requesting it.
#
# Usage (with the sample manual dispatcher above): Actions tab -> Pullfrog ->
# Run workflow -> fill in prompt (and optionally a run name), or
# `gh workflow run pullfrog.yml -f prompt="..."`. A caller can instead wire
# this job to an automatic event (e.g. pull_request) if that's what it needs.
name: Pullfrog

on:
  workflow_call:
    inputs:
      prompt:
        type: string
        description: Agent prompt
        required: true

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@a809795406487e13f894c681ea09b4f96015284d # v0.1.36
        with:
          prompt: ${{ inputs.prompt }}
          # push defaults to "enabled" in the action itself; this job only
          # grants id-token/contents:read for auth and review use, so keep
          # it read-only here rather than relying on job permissions alone.
          push: disabled
          shell: restricted
        env:
          # Provider API keys — set at least one as a repo/org secret.
          # Unset ones simply resolve to empty and are ignored by the action.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY:
            ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>

          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>
