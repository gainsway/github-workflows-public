name: ci for nuget packages

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: true
        type: string
        default: "9.0.x"
    secrets:
      NUGET_TOKEN:
        required: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GITHUB_OWNER: gainsway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Configure Nuget sources
        run: dotnet nuget add source --username $GITHUB_OWNER --password ${{ secrets.NUGET_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/$GITHUB_OWNER/index.json"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
