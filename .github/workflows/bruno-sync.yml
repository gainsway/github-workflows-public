name: Sync Bruno collections from OpenAPI
on:
  workflow_call:
    inputs:
      spec-path:
        required: true
        type: string
      target-collection:
        required: true
        type: string
      local-dev-repo:
        type: string
        default: gainsway/local-dev
      target-base-ref:
        type: string
        default: main
      scripts-ref:
        description: Match the branch or commit SHA of this reusable workflow
        type: string
        default: main
      node-version:
        type: string
        default: '24'
    secrets:
      GH_PAT:
        required: true
jobs:
  sync-bruno:
    runs-on: ubuntu-latest
    concurrency:
      group: bruno-sync-${{ inputs.local-dev-repo }}-${{ inputs.target-collection }}
      cancel-in-progress: false
    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          path: service
          persist-credentials: false
      - name: Checkout collection repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.local-dev-repo }}
          ref: ${{ inputs.target-base-ref }}
          token: ${{ secrets.GH_PAT }}
          path: local-dev
          persist-credentials: false
      - name: Checkout reusable sync scripts
        uses: actions/checkout@v4
        with:
          repository: gainsway/github-workflows-public
          ref: ${{ inputs.scripts-ref }}
          path: workflow-repo
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install converter dependencies
        working-directory: workflow-repo/scripts/bruno-sync
        run: npm ci --ignore-scripts
      - name: Verify safe spec and collection paths
        id: inputs
        env:
          SPEC_PATH: ${{ inputs.spec-path }}
          COLLECTION_PATH: ${{ inputs.target-collection }}
        shell: bash
        run: |
          set -euo pipefail
          spec="$(realpath -e "service/$SPEC_PATH")"
          source="$(realpath service)"
          case "$spec" in "$source"/*) ;; *) echo 'Unsafe spec path' >&2; exit 1 ;; esac
          case "$COLLECTION_PATH" in bruno-collection/*) ;; *) echo 'Target must be inside bruno-collection' >&2; exit 1 ;; esac
          target="$(realpath -e "local-dev/$COLLECTION_PATH")"
          root="$(realpath local-dev)"
          case "$target" in "$root"/bruno-collection/*) ;; *) echo 'Unsafe target path' >&2; exit 1 ;; esac
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "branch=automation/openapi-${{ github.repository_id }}-$(printf '%s' "$COLLECTION_PATH" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Sync OpenCollection YAML
        working-directory: workflow-repo/scripts/bruno-sync
        env:
          SPEC: ${{ steps.inputs.outputs.spec }}
          TARGET: ${{ steps.inputs.outputs.target }}
        run: node generate-bruno-collection.mjs --spec "$SPEC" --target "$TARGET" --format yml
      - name: Create or update draft PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT }}
          path: local-dev
          base: ${{ inputs.target-base-ref }}
          branch: ${{ steps.inputs.outputs.branch }}
          add-paths: ${{ inputs.target-collection }}
          draft: true
          delete-branch: false
          commit-message: 'chore: update OpenCollection YAML from ${{ github.repository }}'
          title: 'chore: sync OpenCollection YAML from ${{ github.repository }}'
          body: |
            OpenAPI source: \`${{ github.repository }}\` at \`${{ github.sha }}\`
            Spec: \`${{ inputs.spec-path }}\`
            Collection: \`${{ inputs.target-collection }}\`
            New endpoints and schema fields are added. Existing authentication, scripts,
            variables, configured values, and saved response examples are preserved.
            Endpoints absent from the spec are not automatically deleted.
            Review this draft before merging.
